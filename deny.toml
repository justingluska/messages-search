# cargo-deny policy: `cargo deny check` (licenses, advisories, bans, sources).
[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
yanked = "warn"
ignore = [
    # `paste` is unmaintained; it's a build-time proc macro pulled in by
    # tokenizers (via fastembed) and never runs in the app.
    { id = "RUSTSEC-2024-0436", reason = "build-time only macro via tokenizers" },
]

[licenses]
# Everything here is compatible with distributing under GPL-3.0-or-later.
allow = [
    "GPL-3.0-or-later", "GPL-3.0", "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0",
    "CC0-1.0", "0BSD", "BSL-1.0", "Unlicense", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
