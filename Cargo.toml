[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
ms-core = { path = "crates/ms-core" }
ms-source = { path = "crates/ms-source" }
ms-embed = { path = "crates/ms-embed" }
ms-engine = { path = "crates/ms-engine" }
# Pinned to the exact version imessage-database uses: both link the bundled
# SQLite, and Cargo allows only one crate linking `sqlite3`.
rusqlite = { version = "=0.40.2", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Dev builds of the index/embedding code are unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
